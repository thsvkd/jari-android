name: jari
services:
  api:
    build: ./backend
    environment:
      MOBILE_SECRET_FILE: /run/secrets/mobile_secret
      MOBILE_FCM_CREDENTIALS: /run/secrets/firebase_admin
      MOBILE_DATA_DIR: /data
      MOBILE_REDIS_URL: redis://redis:6379/0
      MOBILE_ORIGINS: https://localhost,capacitor://localhost
    secrets:
      - mobile_secret
      - firebase_admin
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - identity:/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    # 종료는 검색 워커를 멈추고(워커마다 최대 6초) 스레드를 기다린 뒤 Redis 런타임 리스를 놓는다.
    # 그 전에 SIGKILL 되면 리스가 남아, 다음 시작이 리스 TTL(120초)이 끝나기를 기다린다.
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
secrets:
  mobile_secret:
    file: ./backend/.secrets/mobile.key
  firebase_admin:
    file: ./backend/.secrets/firebase-admin.json
volumes:
  identity:
  redis:

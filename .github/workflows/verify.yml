# 푸시·PR 마다 도는 검증. 커밋 훅은 빠른 검사만 하고, 무거운 검증은 여기서 해요.
#   checks: 유닛·모듈 → 통합(실서버 + 가짜 코레일) → 헤드리스 e2e·레이아웃 측정
#   device: GitHub 러너의 Android 에뮬레이터에 dev.thsvkd.jari(디버그 빌드)을 깔고 기기에서만 의미 있는 단계를 돌려요.
#           시간 휠을 넘기는 장면은 빼요: 에뮬레이터 호스트의 소프트웨어 렌더러가 그 장면에서 말없이 죽어요(헤드리스가 대신 재요).
#   device-full: 휠 장면까지 전부, 더 안정적인 렌더러(swangle)로. 필수 검사가 아니고 야간·수동·릴리스 태그에서만 돌아요(약 28분).
# 릴리스 태그(v*)를 푸시할 때는 .githooks/pre-push 가 로컬 에뮬레이터 기기 단계 포함 npm run verify 기록을 요구해요.
name: verify

on:
  pull_request:
  push:
    # 모든 브랜치: main 보호 규칙은 이 검사를 통과한 커밋만 받으니, 브랜치에서 먼저 초록불을 보고 main 으로 올려요.
    branches: ["**"]
    # 릴리스 태그에서는 device-full 만 돌아요(checks·device 는 그 커밋의 브랜치 실행이 이미 초록이에요).
    tags: ["v*"]
  schedule:
    # 매일 03:00(한국) main 에서 device-full. 실패는 다음에 시작하는 세션이 첫 일로 맡아요(AGENTS.md).
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  # 야간·수동 실행이 같은 ref 의 푸시 실행을 취소하지 않게 이벤트 이름까지 묶어요.
  group: verify-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  # 테스트의 날짜·시각은 한국 시간을 가정해요. 러너 기본값(UTC)이면 자정 근처 계산이 어긋나요.
  TZ: Asia/Seoul

jobs:
  checks:
    if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 의존성
        run: |
          npm ci
          npx playwright install --with-deps chromium
          cd backend && uv sync --frozen
      # 러너 기본 글꼴에는 한글 굵은 글씨가 없어 제목이 보통 굵기·좁은 폭으로 그려져요. 글자 폭·넘침을 실제에 가깝게 재려고 깔아요.
      # 앱 글꼴 목록의 "Noto Sans KR" 이름을 설치된 "Noto Sans CJK KR" 로 이어요(앱 CSS 는 그대로 둬요).
      - name: 한글 글꼴
        run: |
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          mkdir -p ~/.config/fontconfig
          cat > ~/.config/fontconfig/fonts.conf <<'XML'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <alias binding="same"><family>Noto Sans KR</family><prefer><family>Noto Sans CJK KR</family></prefer></alias>
          </fontconfig>
          XML
          fc-cache -f >/dev/null
          fc-match "Noto Sans KR:bold"
      - name: 전체 검증 (기기 제외)
        run: node scripts/verify.mjs --ci
      - name: e2e 결과
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  device:
    if: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: KVM(에뮬레이터 하드웨어 가속)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 의존성
        run: |
          npm ci
          npx playwright install chromium
          cd backend && uv sync --frozen
      - name: 에뮬레이터에서 기기 단계
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 34 이미지의 WebView(113)는 Playwright 가 붙을 때 쓰는 CDP 명령(Browser.setDownloadBehavior)을 몰라요. 더 새 이미지를 써요.
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # 부팅 직후 잠금 화면을 걷어요. 검증 스크립트는 잠긴 기기를 거부해요.
          # 실패하면 에뮬레이터가 꺼지기 전에 WebView·앱이 왜 죽었는지 남겨요(에뮬레이터가 아예 사라졌는지도 adb devices 로 봐요).
          # 기기가 사라지면 adb 가 기기를 끝없이 기다려 잡이 시간 제한으로 취소되고 기록도 못 올려요. 명령마다 60초로 끊어요.
          script: |
            adb shell input keyevent 82
            node scripts/verify.mjs --ci --device --only=에뮬레이터 || { mkdir -p test-results; timeout 60 adb devices -l > test-results/adb-devices.txt 2>&1; timeout 60 adb logcat -d -b crash > test-results/logcat-crash.txt 2>&1; timeout 60 adb logcat -d -v time | grep -iE "chromium|webview|sandboxed_process|lowmemorykiller|am_kill|has died|Fatal|ANR|dev\.thsvkd\.jari" | tail -n 600 > test-results/logcat-webview.txt 2>&1; exit 1; }
      # adb 에 에뮬레이터가 없으면 앱·테스트 실패가 아니라 에뮬레이터가 사라진 거예요. 이 경우에만 한 번 재실행해요(AGENTS.md).
      - name: 에뮬레이터 사라짐 판정
        if: failure()
        run: |
          if [ -f test-results/adb-devices.txt ] && ! grep -q "emulator-" test-results/adb-devices.txt; then
            echo "::warning title=에뮬레이터 사라짐::기기 목록이 비었어요. 호스트 렌더러 충돌로 보이니 이 실행을 한 번만 다시 돌려 보세요."
          fi
      # 에뮬레이터가 말없이 꺼지면 러너가 메모리가 모자라 끈 것인지 커널 기록으로 가려요.
      - name: 러너 메모리 부족 기록
        if: failure()
        run: sudo dmesg | grep -iE "out of memory|oom-kill|killed process" | tail -n 20 || true
      - name: 기기 단계 결과
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-results
          path: test-results/
          retention-days: 7

  device-full:
    if: ${{ startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: KVM(에뮬레이터 하드웨어 가속)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 의존성
        run: |
          npm ci
          npx playwright install chromium
          cd backend && uv sync --frozen
      - name: 에뮬레이터에서 기기 단계
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # API 34 이미지의 WebView(113)는 Playwright 가 붙을 때 쓰는 CDP 명령(Browser.setDownloadBehavior)을 몰라요. 더 새 이미지를 써요.
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swangle_indirect -noaudio -no-boot-anim -camera-back none
          # 부팅 직후 잠금 화면을 걷어요. 검증 스크립트는 잠긴 기기를 거부해요.
          # 실패하면 에뮬레이터가 꺼지기 전에 WebView·앱이 왜 죽었는지 남겨요(에뮬레이터가 아예 사라졌는지도 adb devices 로 봐요).
          # 기기가 사라지면 adb 가 기기를 끝없이 기다려 잡이 시간 제한으로 취소되고 기록도 못 올려요. 명령마다 60초로 끊어요.
          script: |
            adb shell input keyevent 82
            JARI_DEVICE_WHEEL=1 node scripts/verify.mjs --ci --device --only=에뮬레이터 || { mkdir -p test-results; timeout 60 adb devices -l > test-results/adb-devices.txt 2>&1; timeout 60 adb logcat -d -b crash > test-results/logcat-crash.txt 2>&1; timeout 60 adb logcat -d -v time | grep -iE "chromium|webview|sandboxed_process|lowmemorykiller|am_kill|has died|Fatal|ANR|dev\.thsvkd\.jari" | tail -n 600 > test-results/logcat-webview.txt 2>&1; exit 1; }
      # adb 에 에뮬레이터가 없으면 앱·테스트 실패가 아니라 에뮬레이터가 사라진 거예요. 이 경우에만 한 번 재실행해요(AGENTS.md).
      - name: 에뮬레이터 사라짐 판정
        if: failure()
        run: |
          if [ -f test-results/adb-devices.txt ] && ! grep -q "emulator-" test-results/adb-devices.txt; then
            echo "::warning title=에뮬레이터 사라짐::기기 목록이 비었어요. 호스트 렌더러 충돌로 보이니 이 실행을 한 번만 다시 돌려 보세요."
          fi
      # 에뮬레이터가 말없이 꺼지면 러너가 메모리가 모자라 끈 것인지 커널 기록으로 가려요.
      - name: 러너 메모리 부족 기록
        if: failure()
        run: sudo dmesg | grep -iE "out of memory|oom-kill|killed process" | tail -n 20 || true
      - name: 기기 단계 결과
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: device-full-results
          path: test-results/
          retention-days: 7

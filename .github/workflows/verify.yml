# 실기기를 뺀 전체 검증. main 브랜치 보호 규칙에서 이 작업을 필수로 두면, 통과하지 않은 변경은 병합되지 않아요.
# 실기기 e2e 는 로컬 npm run verify 가 맡고, 커밋 전 도장으로 확인해요.
name: verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 의존성
        run: |
          npm ci
          npx playwright install --with-deps chromium
          cd backend && uv sync --frozen
      - name: 전체 검증 (실기기 제외)
        run: node scripts/verify.mjs --ci
      - name: e2e 결과
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

# pi5-s2 overlay. The Telegram bot already owns 127.0.0.1:8081.
# Join the shared gateway network; do not attach to korail-bot networks.
services:
  api:
    container_name: jari-mobile-api
    ports: !override
      - "127.0.0.1:8082:8081"
    environment:
      MOBILE_ORIGINS: https://localhost,capacitor://localhost,https://jari.thsvkd.dev,https://jari.thsvkd.dev:4443
    networks:
      - default
      - edge
  redis:
    container_name: jari-mobile-redis

networks:
  edge:
    external: true
    name: edge

apply plugin: 'com.android.application'

// Release signing. Reads android/keystore.properties (gitignored) if present,
// otherwise falls back to JARI_RELEASE_* environment variables. Neither is
// committed or created by this repo. When neither is configured, the release
// signingConfig is simply left out below -- Debug and E2e stay unaffected,
// they never reference it.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def releaseStoreFile = keystoreProps.getProperty('storeFile') ?: System.getenv('JARI_RELEASE_STORE_FILE')
def releaseStorePassword = keystoreProps.getProperty('storePassword') ?: System.getenv('JARI_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = keystoreProps.getProperty('keyAlias') ?: System.getenv('JARI_RELEASE_KEY_ALIAS')
def releaseKeyPassword = keystoreProps.getProperty('keyPassword') ?: System.getenv('JARI_RELEASE_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace "com.jari.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.jari.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 41200
        versionName "4.12.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
        // The local end-to-end stack only. Installs beside the real app (its own id, storage and
        // Keystore entry) and may speak plain HTTP to the PC's server over adb reverse, nothing else.
        e2e {
            initWith debug
            applicationIdSuffix ".e2e"
            versionNameSuffix "-e2e"
            matchingFallbacks = ['debug']
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
        // Firebase knows only com.jari.app, so the e2e variant (and its push) goes without it.
        tasks.matching { it.name == 'processE2eGoogleServices' }.configureEach { enabled = false }
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

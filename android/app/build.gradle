apply plugin: 'com.android.application'

// Release signing. Reads android/keystore.properties (gitignored) if present,
// otherwise falls back to JARI_RELEASE_* environment variables. Neither is
// committed or created by this repo. When neither is configured, the release
// signingConfig is simply left out below -- Debug stays unaffected,
// it never references it.
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def releaseStoreFile = keystoreProps.getProperty('storeFile') ?: System.getenv('JARI_RELEASE_STORE_FILE')
def releaseStorePassword = keystoreProps.getProperty('storePassword') ?: System.getenv('JARI_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = keystoreProps.getProperty('keyAlias') ?: System.getenv('JARI_RELEASE_KEY_ALIAS')
def releaseKeyPassword = keystoreProps.getProperty('keyPassword') ?: System.getenv('JARI_RELEASE_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

def apkUpdateManifestUrl = System.getenv('JARI_APK_UPDATE_MANIFEST_URL')?.trim()
def apkUpdatePublicKey = System.getenv('JARI_APK_UPDATE_PUBLIC_KEY')?.trim()
if ((apkUpdateManifestUrl && !apkUpdatePublicKey) || (!apkUpdateManifestUrl && apkUpdatePublicKey)) {
    throw new GradleException('JARI_APK_UPDATE_MANIFEST_URL and JARI_APK_UPDATE_PUBLIC_KEY must be configured together')
}
if (apkUpdateManifestUrl) {
    def updateUri
    try {
        updateUri = new URI(apkUpdateManifestUrl)
    } catch (Exception error) {
        throw new GradleException('JARI_APK_UPDATE_MANIFEST_URL must be a valid HTTPS URL', error)
    }
    if (updateUri.scheme != 'https' || !updateUri.host || updateUri.userInfo != null || updateUri.fragment != null) {
        throw new GradleException('JARI_APK_UPDATE_MANIFEST_URL must be a valid HTTPS URL')
    }
    try {
        def keyBytes = Base64.decoder.decode(apkUpdatePublicKey)
        def key = java.security.KeyFactory.getInstance('RSA').generatePublic(
            new java.security.spec.X509EncodedKeySpec(keyBytes)
        )
        if (!(key instanceof java.security.interfaces.RSAPublicKey) || key.modulus.bitLength() < 2048) {
            throw new GradleException('JARI_APK_UPDATE_PUBLIC_KEY must be an RSA key with at least 2048 bits')
        }
    } catch (GradleException error) {
        throw error
    } catch (Exception error) {
        throw new GradleException('JARI_APK_UPDATE_PUBLIC_KEY must be base64 DER SPKI RSA public key', error)
    }
}

def buildConfigString = { value -> '"' + (value ?: '').replace('\\', '\\\\').replace('"', '\\"') + '"' }

android {
    namespace "com.jari.app"
    compileSdk rootProject.ext.compileSdkVersion
    testBuildType project.hasProperty('jariPlayUpdateTest') ? 'release' : 'debug'
    defaultConfig {
        // The installed package (Play's permanent ID). com.jari.app was taken on Play; the code's
        // namespace, Java package and MainActivity stay com.jari.app.
        applicationId "dev.thsvkd.jari"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 42300
        versionName "4.23.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig true
    }
    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            buildConfigField "String", "JARI_APK_UPDATE_MANIFEST_URL", buildConfigString(apkUpdateManifestUrl)
            buildConfigField "String", "JARI_APK_UPDATE_PUBLIC_KEY", buildConfigString(apkUpdatePublicKey)
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (project.hasProperty('jariPlayUpdateTest')) {
                // Instrumentation-only Play fake tests need an installable target.
                signingConfig signingConfigs.debug
                applicationIdSuffix '.playtest'
            } else if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    releaseImplementation 'com.google.android.play:app-update:2.1.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    // -PjariNoFirebase: the device stage of scripts/verify.mjs builds the debug app without Firebase,
    // so the emulator run never asks for notification permission or registers a push token.
    if (servicesJSON.text && !project.hasProperty('jariNoFirebase')) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
